# Render Blueprint: New + > Blueprint > connect this repo.
services:
  - type: web
    name: gpta
    runtime: docker
    plan: starter            # NOT free: the free plan sleeps after 15 min idle (scheduler stops) and has no persistent disk
    numInstances: 1          # must stay 1 (in-process scheduler + SQLite)
    healthCheckPath: /api/health
    disk:
      name: gpta-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - { key: GPTA_DB, value: /data/gpta.db }
      - { key: GPTA_API_TOKEN, generateValue: true }   # copy it from the Render dashboard; it is your dashboard login
      - { key: TWELVE_DATA_KEY_1, sync: false }
      - { key: TWELVE_DATA_KEY_2, sync: false }
      - { key: TWELVE_DATA_KEY_3, sync: false }
      - { key: TWELVE_DATA_KEY_4, sync: false }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_CHAT_ID, sync: false }
      - { key: SHOWMYTRADES_URL, sync: false }
      - { key: SHOWMYTRADES_KEY, sync: false }
